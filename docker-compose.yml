services:
  postgres:
    image: postgres:16
    container_name: rakthasethu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rakthasethu}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - rakthasethu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rakthasethu}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rakthasethu_postgres_data:
    name: rakthasethu_postgres_data
